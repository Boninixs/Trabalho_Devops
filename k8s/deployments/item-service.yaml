apiVersion: apps/v1
kind: Deployment
metadata:
  name: item-service
  namespace: devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: item-service
  template:
    metadata:
      labels:
        app: item-service
    spec:
      containers:
      - name: item-service
        image: boninixs/item-service:latest
        imagePullPolicy: IfNotPresent 
        ports:
        - containerPort: 8000
        env:
        # ConfigMap global
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: LOG_LEVEL
        - name: SERVICE_NAME
          value: "item-service"
        - name: SERVICE_VERSION
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: SERVICE_VERSION
        - name: SERVICE_PORT
          value: "8000"
        - name: RABBITMQ_URL
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: RABBITMQ_URL
        - name: RABBITMQ_EVENTS_EXCHANGE
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: RABBITMQ_EVENTS_EXCHANGE
        - name: RABBITMQ_DEAD_LETTER_EXCHANGE
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: RABBITMQ_DEAD_LETTER_EXCHANGE
        # Database
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: item-postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: item-postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: item-postgres-config
              key: POSTGRES_DB
        - name: DATABASE_URL
          value: "postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@item-postgres-service:5432/$(POSTGRES_DB)"
        - name: DATABASE_ECHO
          value: "false"
        # Outbox específico do item
        - name: OUTBOX_PUBLISHER_ENABLED
          value: "true"
        - name: OUTBOX_PUBLISH_POLL_INTERVAL_SECONDS
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: OUTBOX_PUBLISH_POLL_INTERVAL_SECONDS
        - name: OUTBOX_PUBLISH_BATCH_SIZE
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: OUTBOX_PUBLISH_BATCH_SIZE
        - name: OUTBOX_PUBLISH_RETRY_DELAY_SECONDS
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: OUTBOX_PUBLISH_RETRY_DELAY_SECONDS
        - name: OUTBOX_PUBLISH_MAX_ATTEMPTS
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: OUTBOX_PUBLISH_MAX_ATTEMPTS
        # Health Check
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20