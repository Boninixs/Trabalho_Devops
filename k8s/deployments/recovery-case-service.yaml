apiVersion: apps/v1
kind: Deployment
metadata:
  name: recovery-case-service
  namespace: devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recovery-case-service
  template:
    metadata:
      labels:
        app: recovery-case-service
    spec:
      containers:
      - name: recovery-case-service
        image: boninixs/recovery-case-service:latest
        imagePullPolicy: IfNotPresent 
        ports:
        - containerPort: 8000
        env:
        # ConfigMap global
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: LOG_LEVEL
        - name: SERVICE_NAME
          value: "recovery-case-service"
        - name: SERVICE_VERSION
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: SERVICE_VERSION
        - name: SERVICE_PORT
          value: "8000"
        - name: RABBITMQ_URL
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: RABBITMQ_URL
        - name: RABBITMQ_EVENTS_EXCHANGE
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: RABBITMQ_EVENTS_EXCHANGE
        - name: RABBITMQ_DEAD_LETTER_EXCHANGE
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: RABBITMQ_DEAD_LETTER_EXCHANGE
        # Database
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: recovery-postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: recovery-postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: recovery-postgres-config
              key: POSTGRES_DB
        - name: DATABASE_URL
          value: "postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@recovery-postgres-service:5432/$(POSTGRES_DB)"
        - name: DATABASE_ECHO
          value: "false"
        # Específicos do Recovery
        - name: EVENT_CONSUMER_ENABLED
          value: "true"
        - name: OUTBOX_PUBLISHER_ENABLED
          value: "true"
        - name: ITEM_SERVICE_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: ITEM_SERVICE_BASE_URL
        - name: ITEM_SERVICE_TIMEOUT_SECONDS
          value: "10"
        - name: OUTBOX_PUBLISH_POLL_INTERVAL_SECONDS
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: OUTBOX_PUBLISH_POLL_INTERVAL_SECONDS
        - name: OUTBOX_PUBLISH_BATCH_SIZE
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: OUTBOX_PUBLISH_BATCH_SIZE
        - name: OUTBOX_PUBLISH_RETRY_DELAY_SECONDS
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: OUTBOX_PUBLISH_RETRY_DELAY_SECONDS
        - name: OUTBOX_PUBLISH_MAX_ATTEMPTS
          valueFrom:
            configMapKeyRef:
              name: services-config
              key: OUTBOX_PUBLISH_MAX_ATTEMPTS
        # Health Check
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20