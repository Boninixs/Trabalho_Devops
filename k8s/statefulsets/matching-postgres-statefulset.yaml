apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: matching-postgres
  namespace: devops
spec:
  serviceName: "matching-postgres-service"
  replicas: 1
  selector:
    matchLabels:
      app: matching-postgres
  template:
    metadata:
      labels:
        app: matching-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: matching-postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: matching-postgres-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: matching-postgres-config
              key: POSTGRES_DB
        volumeMounts:
        - name: matching-postgres-storage
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: matching-postgres-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi