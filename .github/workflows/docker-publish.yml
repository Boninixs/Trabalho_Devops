name: Docker Hub Publish

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "auth-service/**"
      - "gateway/**"
      - "item-service/**"
      - "matching-service/**"
      - "recovery-case-service/**"
      - ".github/workflows/**"
  push:
    branches: [develop]
    paths:
      - "auth-service/**"
      - "gateway/**"
      - "item-service/**"
      - "matching-service/**"
      - "recovery-case-service/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  docker:
    name: ${{ matrix.service }} / docker
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - gateway
          - item-service
          - matching-service
          - recovery-case-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ matrix.service }}:pr-${{ github.event.pull_request.number }}

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:develop
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest-dev
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:sha-${{ github.sha }}
