name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            test_path: tests/unit
          - service: item-service
            test_path: tests/unit
          - service: matching-service
            test_path: tests/unit
          - service: recovery-case-service
            test_path: tests/unit
          - service: gateway
            test_path: tests/unit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        working-directory: ${{ matrix.service }}
        run: pytest ${{ matrix.test_path }} -q

  unit-tests-required:
    name: unit-tests / required
    runs-on: ubuntu-latest
    needs: unit-tests
    if: ${{ always() }}
    timeout-minutes: 5

    steps:
      - name: Require all microservice unit tests
        run: |
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "One or more microservice unit test jobs failed."
            exit 1
          fi

          echo "All microservice unit test jobs passed."
