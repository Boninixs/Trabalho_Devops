name: Matching Service CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "matching-service/**"
      - ".github/workflows/matching-service-ci.yml"
  push:
    branches:
      - main
    paths:
      - "matching-service/**"
      - ".github/workflows/matching-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matching-service-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: matching-service / tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: matching_service_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d matching_service_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/matching_service_test
      MATCHING_SERVICE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/matching_service_test
      RABBITMQ_URL: amqp://app:app@127.0.0.1:5672/
      RABBITMQ_EVENTS_EXCHANGE: domain.events
      RABBITMQ_DEAD_LETTER_EXCHANGE: domain.events.dlx
      EVENT_CONSUMER_ENABLED: "false"
      OUTBOX_PUBLISHER_ENABLED: "false"
      METRICS_ENABLED: "true"
      OUTBOX_PUBLISH_POLL_INTERVAL_SECONDS: "1"
      OUTBOX_PUBLISH_BATCH_SIZE: "50"
      OUTBOX_PUBLISH_RETRY_DELAY_SECONDS: "2"
      OUTBOX_PUBLISH_MAX_ATTEMPTS: "10"

    defaults:
      run:
        working-directory: matching-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: matching-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run matching-service tests
        run: pytest -q
