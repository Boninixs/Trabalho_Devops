jobs:
  build-test-sonar-docker:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: recovery-case-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.sources=recovery-case-service/app
            -Dsonar.tests=recovery-case-service/tests
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build Docker image
        working-directory: ${{ github.workspace }}
        run: docker build -t recovery-case-service:${{ github.sha }} -f ./recovery-case-service/Dockerfile ./recovery-case-service
