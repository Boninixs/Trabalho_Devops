name: CI recovery-case-service

on:
  workflow_call:

jobs:
  tests:
    name: Recovery Case Service / Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: recovery-case-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: pytest

  sonar:
    name: Recovery Case Service / Sonar
    runs-on: ubuntu-latest
    needs: tests

    defaults:
      run:
        working-directory: recovery-case-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.sources=recovery-case-service/app
            -Dsonar.tests=recovery-case-service/tests
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
    name: Recovery Case Service / Docker Build
    runs-on: ubuntu-latest
    needs: sonar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./recovery-case-service
          file: ./recovery-case-service/Dockerfile
          push: false
          tags: recovery-case-service:ci-${{ github.sha }}
